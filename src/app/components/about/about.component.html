<div class="owner-bio-wrapper" *ngIf="ownerData">

  <div class="owner-bio-card">

    <!-- IMAGE -->
    <div class="image-column">
      <img
        [src]="ownerData.imageUrl"
        [alt]="ownerData.name"
        class="owner-image"
      />
    </div>

    <!-- CONTENT -->
    <div class="content-column">

      <header class="header">
        <h2 class="name">{{ ownerData.name }}</h2>
        <span class="title">{{ ownerData.title }}</span>
        <div class="divider"></div>
      </header>

      <section class="bio">
        <p *ngFor="let paragraph of bioParagraphs">
          {{ paragraph }}
        </p>
      </section>

    </div>

  </div>

</div>
