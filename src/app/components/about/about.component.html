<section class="about-section" *ngIf="ownerData">

  <div class="about-header">
    <span class="about-eyebrow">Meet the Founder</span>
    <h2 class="about-section-title">The Heart Behind She Gathers</h2>
    <div class="about-rule" aria-hidden="true"></div>
  </div>

  <div class="owner-bio-card">

    <div class="image-column">
      <img
        [src]="ownerData.imageUrl"
        [alt]="ownerData.name"
        class="owner-image"
      />
    </div>

    <div class="content-column">

      <header class="bio-header">
        <h3 class="name">{{ ownerData.name }}</h3>
        <span class="title">{{ ownerData.title }}</span>
        <div class="divider"></div>
      </header>

      <section class="bio">
        <p *ngFor="let paragraph of bioParagraphs">{{ paragraph }}</p>
      </section>

    </div>

  </div>

</section>
